services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: goldhunter
      POSTGRES_USER: goldhunter
      POSTGRES_PASSWORD: goldhunter
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U goldhunter -d goldhunter"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://goldhunter:goldhunter@db:5432/goldhunter
      CORS_ORIGINS: "*"
      SATELLITE_COLLECTION: sentinel-2-l2a
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata: